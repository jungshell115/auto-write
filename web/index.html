<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#010102" />
    <title>Auto Write</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body>

    <!-- Top nav -->
    <nav class="top-nav">
      <span class="nav-brand">
        <span class="nav-brand-dot"></span>
        Auto Write
      </span>
      <div class="nav-actions">
        <div class="status-card">
          <span class="pulse-dot"></span>
          <span id="serverStatus">서버 확인 중</span>
        </div>
        <button id="refreshButton" class="btn-ghost">새로고침</button>
      </div>
    </nav>

    <main class="app-shell">

      <!-- Record Panel — 최상단 배치 -->
      <section class="card record-panel" style="margin-bottom:12px;">

        <!-- 1. 녹음 버튼 (최상단, 가장 눈에 띄게) -->
        <div class="record-primary-row">
          <button id="recordButton" class="btn-record-primary">
            <span class="record-dot-big"></span>
            <span id="recordLabel">회의 녹음 시작</span>
          </button>
          <span id="recordTimer" class="record-timer hidden">00:00</span>
        </div>

        <div class="or-divider"><span>또는 파일 업로드</span></div>

        <!-- 2. 파일 업로드 (보조) -->
        <div class="upload-row" style="margin-bottom:16px;">
          <input id="audioFile" type="file" accept="audio/*" />
          <button id="uploadButton" class="btn-primary">업로드 &amp; 분석</button>
        </div>

        <!-- 3. 자동 수집 정보 -->
        <div class="auto-info-row">
          <div class="auto-info-item">
            <span class="auto-info-label">📍 장소</span>
            <span id="locationDisplay" class="auto-info-value">위치 확인 중...</span>
          </div>
          <div class="auto-info-item">
            <span class="auto-info-label">🕐 일시</span>
            <span id="datetimeDisplay" class="auto-info-value">—</span>
          </div>
        </div>

        <!-- 4. 회의 정보 (보조) -->
        <div class="form-grid" style="margin-top:12px;">
          <label>
            회의 유형
            <select id="meetingType">
              <option value="general">일반</option>
              <option value="planning">기획</option>
              <option value="hr">인사</option>
              <option value="external">대외</option>
              <option value="other">기타</option>
            </select>
          </label>
          <label>
            회의 제목
            <input id="meetingTitle" type="text" placeholder="AI가 자동 생성합니다" />
          </label>
        </div>

        <p id="recordingHint" class="record-hint">iPhone Safari에서는 마이크 권한 요청이 표시됩니다.</p>
      </section>

      <!-- Toolbar -->
      <div class="card toolbar" style="margin-bottom:12px;">
        <label class="search-box" style="flex:1 1 260px;">
          <input id="searchInput" type="search" placeholder="회의 제목 또는 파일명 검색" />
        </label>
        <label style="white-space:nowrap; min-width:100px;">
          <select id="filterType">
            <option value="">전체 유형</option>
            <option value="general">일반</option>
            <option value="planning">기획</option>
            <option value="hr">인사</option>
            <option value="external">대외</option>
            <option value="other">기타</option>
          </select>
        </label>
        <button id="filterButton" class="btn-secondary">필터 적용</button>
      </div>

      <!-- Content grid -->
      <div class="content-grid">

        <!-- Meeting list -->
        <aside>
          <div class="list-header">
            <h2>회의 목록</h2>
            <span id="meetingCount" class="meeting-count">0개</span>
          </div>
          <div id="meetingList" class="meeting-list"></div>
        </aside>

        <!-- Detail -->
        <section class="card-xl detail-card">
          <div id="emptyDetail" class="empty-detail">
            <h2>회의를 선택하세요</h2>
            <p>완료된 회의는 요약, 결정사항, 할 일, 전사 전문, 공유 링크를 확인할 수 있습니다.</p>
          </div>

          <article id="meetingDetail" class="hidden">
            <div class="detail-header">
              <div>
                <p id="detailMeta" class="eyebrow" style="margin-bottom:6px;"></p>
                <h2 id="detailTitle" style="margin-bottom:0;"></h2>
              </div>
              <div class="action-group">
                <button id="shareButton" class="btn-ghost">공유 링크</button>
                <a id="markdownLink" class="btn-ghost ghost-link" target="_blank">Markdown</a>
                <a id="pdfLink" class="btn-ghost ghost-link" target="_blank">PDF</a>
              </div>
            </div>

            <div id="shareResult" class="share-result hidden"></div>

            <div class="section-label">AI 요약</div>
            <div class="summary-block" style="margin-bottom:20px;">
              <p id="summaryText"></p>
            </div>

            <div class="two-column" style="margin-bottom:20px;">
              <div>
                <div class="section-label">결정 사항</div>
                <ul id="decisionsList"></ul>
              </div>
              <div>
                <div class="section-label">할 일</div>
                <ul id="actionsList"></ul>
              </div>
            </div>

            <div class="section-label">전사 전문</div>
            <div id="transcriptList" class="transcript-list"></div>
          </article>
        </section>
      </div>

    </main>

    <script src="/app.js?v=5" type="module"></script>
  </body>
</html>
