<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#010102" />
    <title>Auto Write</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=5" />
  </head>
  <body>

    <!-- Auth gate -->
    <div id="authGate" class="auth-gate hidden">
      <div class="auth-box">
        <span class="nav-brand-dot" style="margin:0 auto 16px;display:block;width:12px;height:12px;"></span>
        <h2 style="text-align:center;margin-bottom:8px;">Auto Write</h2>
        <p style="text-align:center;color:var(--ink-subtle);font-size:14px;margin-bottom:20px;">접근 비밀번호를 입력하세요</p>
        <input id="authInput" type="password" placeholder="비밀번호" style="margin-bottom:12px;" />
        <button id="authSubmit" class="btn-primary" style="width:100%;">확인</button>
        <p id="authError" class="hidden" style="color:#e05577;font-size:13px;text-align:center;margin-top:8px;">비밀번호가 틀렸습니다.</p>
      </div>
    </div>

    <!-- Top nav -->
    <nav class="top-nav">
      <span class="nav-brand">
        <span class="nav-brand-dot"></span>
        Auto Write
      </span>
      <div class="nav-actions">
        <div class="status-card">
          <span class="pulse-dot"></span>
          <span id="serverStatus">서버 확인 중</span>
        </div>
        <button id="statsToggle" class="btn-ghost">통계</button>
        <button id="refreshButton" class="btn-ghost">새로고침</button>
      </div>
    </nav>

    <main class="app-shell">

      <!-- Stats panel (collapsed by default) -->
      <div id="statsPanel" class="card stats-panel hidden" style="margin-bottom:12px;">
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="statTotal">—</span>
            <span class="stat-label">전체 회의</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="statCompleted">—</span>
            <span class="stat-label">완료</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="statThisWeek">—</span>
            <span class="stat-label">이번 주</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="statFailed">—</span>
            <span class="stat-label">오류</span>
          </div>
        </div>
        <div id="statsByType" class="stats-by-type"></div>
      </div>

      <!-- Record Panel -->
      <section class="card record-panel" style="margin-bottom:12px;">

        <!-- 1. 녹음 버튼 (최상단) -->
        <div class="record-primary-row">
          <button id="recordButton" class="btn-record-primary">
            <span class="record-dot-big"></span>
            <span id="recordLabel">회의 녹음 시작</span>
          </button>
          <span id="recordTimer" class="record-timer hidden">00:00</span>
        </div>

        <div class="or-divider"><span>또는 파일 업로드</span></div>

        <!-- 2. 파일 업로드 -->
        <div class="upload-row" style="margin-bottom:16px;">
          <input id="audioFile" type="file" accept="audio/*" />
          <button id="uploadButton" class="btn-primary">업로드 &amp; 분석</button>
        </div>

        <!-- 3. 자동 수집 정보 -->
        <div class="auto-info-row">
          <div class="auto-info-item">
            <span class="auto-info-label">📍 장소</span>
            <span id="locationDisplay" class="auto-info-value">위치 확인 중...</span>
          </div>
          <div class="auto-info-item">
            <span class="auto-info-label">🕐 일시</span>
            <span id="datetimeDisplay" class="auto-info-value">—</span>
          </div>
        </div>
        <p class="record-hint">📌 위치는 이 기기 로컬(브라우저 저장소)에만 저장됩니다. 외부로 전송되지 않습니다.</p>

        <!-- 4. 회의 정보 -->
        <div class="form-grid" style="margin-top:12px;">
          <label>
            회의 유형
            <select id="meetingType">
              <option value="general">일반</option>
              <option value="planning">기획</option>
              <option value="hr">인사</option>
              <option value="external">대외</option>
              <option value="other">기타</option>
            </select>
          </label>
          <label>
            템플릿
            <select id="meetingTemplate">
              <option value="general">기본</option>
              <option value="standup">스탠드업</option>
              <option value="1on1">1-on-1</option>
              <option value="planning">기획회의</option>
              <option value="interview">인터뷰</option>
            </select>
          </label>
        </div>
        <label style="margin-top:10px;display:grid;gap:8px;color:var(--ink-subtle);font-size:13px;font-weight:500;">
          회의 제목 (비워두면 AI가 자동 생성)
          <input id="meetingTitle" type="text" placeholder="AI가 자동으로 생성합니다" />
        </label>
      </section>

      <!-- Toolbar -->
      <div class="card toolbar" style="margin-bottom:12px;">
        <label class="search-box" style="flex:1 1 260px;">
          <input id="searchInput" type="search" placeholder="제목 · 내용 · 전사 내용 검색" />
        </label>
        <label style="white-space:nowrap;min-width:100px;">
          <select id="filterType">
            <option value="">전체 유형</option>
            <option value="general">일반</option>
            <option value="planning">기획</option>
            <option value="hr">인사</option>
            <option value="external">대외</option>
            <option value="other">기타</option>
          </select>
        </label>
        <button id="filterButton" class="btn-secondary">검색</button>
      </div>

      <!-- Content grid -->
      <div class="content-grid">
        <aside>
          <div class="list-header">
            <h2>회의 목록</h2>
            <span id="meetingCount" class="meeting-count">0개</span>
          </div>
          <div id="meetingList" class="meeting-list"></div>
        </aside>

        <section class="card-xl detail-card">
          <div id="emptyDetail" class="empty-detail">
            <h2>회의를 선택하세요</h2>
            <p>완료된 회의는 요약, 결정사항, 할 일, 전사 전문, 공유 링크를 확인할 수 있습니다.</p>
          </div>

          <article id="meetingDetail" class="hidden">
            <div class="detail-header">
              <div style="flex:1;min-width:0;">
                <p id="detailMeta" class="eyebrow" style="margin-bottom:6px;"></p>
                <h2 id="detailTitle" style="margin-bottom:0;cursor:pointer;" title="클릭하여 편집"></h2>
              </div>
              <div class="action-group">
                <button id="calendarButton" class="btn-ghost">📅 캘린더</button>
                <button id="shareButton" class="btn-ghost">공유 링크</button>
                <a id="markdownLink" class="btn-ghost ghost-link" target="_blank">MD</a>
                <a id="pdfLink" class="btn-ghost ghost-link" target="_blank">PDF</a>
              </div>
            </div>

            <div id="shareResult" class="share-result hidden"></div>

            <div class="section-label">
              AI 요약
              <button class="edit-toggle-btn" id="editSummaryBtn">편집</button>
            </div>
            <div class="summary-block" style="margin-bottom:20px;">
              <p id="summaryText"></p>
              <textarea id="summaryEdit" class="hidden summary-edit-area" rows="4"></textarea>
              <button id="saveSummaryBtn" class="btn-primary hidden" style="margin-top:8px;font-size:13px;padding:6px 12px;">저장</button>
            </div>

            <div class="two-column" style="margin-bottom:20px;">
              <div>
                <div class="section-label">결정 사항</div>
                <ul id="decisionsList"></ul>
              </div>
              <div>
                <div class="section-label">할 일</div>
                <ul id="actionsList"></ul>
              </div>
            </div>

            <div class="section-label">전사 전문</div>
            <div id="transcriptList" class="transcript-list"></div>
          </article>
        </section>
      </div>

    </main>

    <script src="/app.js?v=6" type="module"></script>
  </body>
</html>
