services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE=meetings
      - DATA_DIR=/data
      - DB_PATH=/data/app.db
      - WEB_DIR=/web
    volumes:
      - app_data:/data
      - ../web:/web:ro
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ../backend
      dockerfile: worker/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE=meetings
      - DATA_DIR=/data
      - DB_PATH=/data/app.db
    volumes:
      - app_data:/data
    depends_on:
      - redis

volumes:
  app_data:
